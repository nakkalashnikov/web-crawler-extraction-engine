[pytest]
asyncio_mode = auto
testpaths = tests
# This file (not the repo-root pyproject.toml) is the ini file pytest
# actually uses for any invocation rooted under workers/tavily-search/ --
# pytest picks exactly one config file, found by walking up from the
# invocation directory, so this local pytest.ini fully shadows the root's
# `addopts = "-m 'not live'"` rather than layering on top of it (confirmed
# empirically while implementing spec-2-1-1: a bare `pytest` here collected
# and ran the new tests/live/ tests instead of deselecting them). Registered
# and excluded here too, matching the root's intent, so a bare `pytest` in
# this directory never depends on real API keys or real network access.
markers =
    live: hits real api.tavily.com, requires real TAVILY_API_KEY_* env var(s)
addopts = -m "not live"
