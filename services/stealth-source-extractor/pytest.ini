[pytest]
asyncio_mode = auto
testpaths = tests
# Repo root, so `from workers import tavily_search` (src/extract.py) resolves
# the same flat client the built Docker image copies in separately.
pythonpath = ../..
# "live" tests hit real, unmocked external sites — mirrors the root
# pyproject.toml's own live-marker convention (pipelines/technik's live
# tests), duplicated here since this worker's tests run against its own
# pytest.ini, not the root one. Run explicitly with `pytest -m live`.
markers =
    live: hits real external sites over the network, no mocks
addopts = -m "not live"
